apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: employee-api-ingress
  namespace: devops
spec:
  podSelector:
    matchLabels:
      app: employee-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: devops
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
