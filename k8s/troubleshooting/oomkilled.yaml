# Intentional failure lab: Python allocates more memory than the 32Mi limit.
# The container is expected to be OOMKilled; use only in ai-sre-lab.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-oomkilled
  namespace: ai-sre-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab-oomkilled
  template:
    metadata:
      labels:
        app: lab-oomkilled
    spec:
      containers:
        - name: memory-hog
          image: python:3.12-alpine
          command:
            - python
            - -c
            - "print('Allocating memory beyond the container limit', flush=True); data = bytearray(200 * 1024 * 1024); print(len(data))"
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: 250m
              memory: 32Mi
